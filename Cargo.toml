[package]
name = "sage-plus-tdf"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
readme = "README.md"
license = "Apache-2.0 AND MIT"
description = "Read-only pure Rust reader for Bruker TDF and TSF acquisitions and ProteoScape miniTDF spectra, used by Sage Plus"
repository = "https://github.com/pgarrett-scripps/sage-plus-tdf"
keywords = ["mass-spectrometry", "bruker", "tdf", "proteomics"]
categories = ["science", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
turso_core = { version = "=0.8.0-pre.13", default-features = false, features = ["fs", "uuid", "json", "pure-rust-crypto"] }
ruzstd = "=0.9.0"
lzf = "=1.0.0"
thiserror = "2"
parquet = { version = "59.2", default-features = false, features = ["snap", "zstd"], optional = true }

[features]
default = []
# ProteoScape miniTDF spectra (Parquet precursor tables).
minitdf = ["dep:parquet"]

[dev-dependencies]
serde_json = "1"
tempfile = "3"
sha2 = "0.10"

[profile.dev]
debug = 0
