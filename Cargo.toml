[package]
name = "timsrust-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "REVIEW.md", "qualification.json", "LICENSE*", "NOTICE.md", "rust-toolchain.toml", "CONTRIBUTING.md", "SECURITY.md", "RELEASING.md", "CHANGELOG.md"]
license = "Apache-2.0 AND MIT"
description = "Read-only native Rust parser for Bruker TDF acquisition directories"
repository = "https://github.com/pgarrett-scripps/timsrust-reader"
keywords = ["mass-spectrometry", "bruker", "tdf", "proteomics"]
categories = ["science", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
turso_core = { version = "=0.8.0-pre.13", default-features = false, features = ["fs", "uuid", "json", "pure-rust-crypto"] }
ruzstd = "=0.9.0"
lzf = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[profile.dev]
debug = 0
