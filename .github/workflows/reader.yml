name: Reader checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CC: prohibited-native-c-compiler
      CXX: prohibited-native-cxx-compiler
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo +1.97.1 install cargo-fuzz --version 0.13.2 --locked
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-25
      - run: cargo +nightly-2026-09-25 fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo +nightly-2026-09-25 fuzz build --dev
      - run: cargo +nightly-2026-09-25 fuzz run decoder --dev -- -max_total_time=30 -timeout=5 -rss_limit_mb=1024 -max_len=65536 -seed=20260926
      - run: cargo +nightly-2026-09-25 fuzz run schema_calibration --dev -- -max_total_time=30 -timeout=5 -rss_limit_mb=1024 -max_len=32768 -seed=20260926
      - run: git diff --exit-code -- fuzz/Cargo.lock

