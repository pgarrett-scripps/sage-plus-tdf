name: Release
# Pushing a tag vX.Y.Z publishes sage-plus-tdf X.Y.Z to crates.io and creates
# the GitHub release. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_DEV: 1.97.1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_DEV }}
      - name: tag matches Cargo.toml version
        id: version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sage-plus-tdf") | .version')"
          echo "Cargo.toml version: $version, tag: $GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG has a released section for this version
        run: .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_DEV }}
      - run: cargo test --locked
        env:
          CC: prohibited-native-c-compiler
          CXX: prohibited-native-cxx-compiler
      - run: cargo test --locked --all-features

  publish:
    needs: [verify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_DEV }}
      - uses: actions/download-artifact@v5
        with:
          name: release-notes
      - run: cargo publish --locked --dry-run
      # Trusted Publishing needs the crate to exist on crates.io with this
      # repository and workflow registered as a trusted publisher. Before that
      # (the first release), this step fails and the CARGO_REGISTRY_TOKEN
      # repository secret is used instead.
      - name: crates.io Trusted Publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no crates.io token: configure Trusted Publishing or set the CARGO_REGISTRY_TOKEN secret (see RELEASING.md)"
            exit 1
          fi
          if [ "$AUTH_OUTCOME" = "success" ]; then
            echo "Publishing with a Trusted Publishing token"
          else
            echo "Trusted Publishing unavailable; publishing with the CARGO_REGISTRY_TOKEN secret"
          fi
          cargo publish --locked
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "sage-plus-tdf $VERSION" --notes-file release-notes.md $prerelease
