[package]
name = "sage-plus-tdf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sage-plus-tdf = { path = ".." }
serde_json = "1"
ruzstd = "=0.9.0"
lzf = "=1.0.0"

[[bin]]
name = "decoder"
path = "fuzz_targets/decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_calibration"
path = "fuzz_targets/schema_calibration.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
